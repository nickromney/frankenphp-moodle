name: frankenphp-moodle

services:
  db:
    image: ${DB_IMAGE:-mariadb:11.8}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MARIADB_ROOT_PASSWORD: ${MOODLE_DB_ROOT_PASSWORD:-rootpass}
      MARIADB_DATABASE: ${MOODLE_DB_NAME:-moodle}
      MARIADB_USER: ${MOODLE_DB_USER:-moodle}
      MARIADB_PASSWORD: ${MOODLE_DB_PASSWORD:-moodlepass}
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h127.0.0.1 -uroot -p$${MARIADB_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    volumes:
      - db_data:/var/lib/mysql

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        FRANKENPHP_IMAGE: ${FRANKENPHP_IMAGE:-dunglas/frankenphp:php8.4-bookworm}
        MOODLE_SERIES: ${MOODLE_SERIES:-stable502}
        MOODLE_VERSION: ${MOODLE_VERSION:-5.2}
        MOODLE_PACKAGE_URL: ${MOODLE_PACKAGE_URL:-}
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_HTTP_PORT: ${APP_HTTP_PORT:-80}
      APP_HTTPS_PORT: ${APP_HTTPS_PORT:-443}
      MOODLE_HOST: ${MOODLE_HOST:-moodle.docker.test.127.0.0.1.sslip.io}
      SERVER_NAME: ${SERVER_NAME:-moodle.docker.test.127.0.0.1.sslip.io}
      MOODLE_AUTO_INSTALL: ${MOODLE_AUTO_INSTALL:-true}
      MOODLE_SITE_SCHEME: ${MOODLE_SITE_SCHEME:-https}
      MOODLE_SITE_URL: ${MOODLE_SITE_URL:-}
      MOODLE_SITE_FULLNAME: ${MOODLE_SITE_FULLNAME:-Moodle}
      MOODLE_SITE_SHORTNAME: ${MOODLE_SITE_SHORTNAME:-Moodle}
      MOODLE_ADMIN_USER: ${MOODLE_ADMIN_USER:-admin}
      MOODLE_ADMIN_PASSWORD: ${MOODLE_ADMIN_PASSWORD:-Adminpass123!}
      MOODLE_ADMIN_EMAIL: ${MOODLE_ADMIN_EMAIL:-demo@moodle.test}
      MOODLE_DB_HOST: db
      MOODLE_DB_PORT: 3306
      MOODLE_DB_NAME: ${MOODLE_DB_NAME:-moodle}
      MOODLE_DB_USER: ${MOODLE_DB_USER:-moodle}
      MOODLE_DB_PASSWORD: ${MOODLE_DB_PASSWORD:-moodlepass}
      MOODLE_DB_WAIT_ATTEMPTS: ${MOODLE_DB_WAIT_ATTEMPTS:-60}
    healthcheck:
      test: ["CMD-SHELL", "curl -kfsS --resolve $${MOODLE_HOST}:443:127.0.0.1 https://$${MOODLE_HOST}/ >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    ports:
      - "${APP_BIND_HOST:-127.0.0.1}:${APP_HTTP_PORT:-80}:80"
      - "${APP_BIND_HOST:-127.0.0.1}:${APP_HTTPS_PORT:-443}:443"
      - "${APP_BIND_HOST:-127.0.0.1}:${APP_HTTPS_PORT:-443}:443/udp"
    volumes:
      - moodle_data:/app/moodledata
      - moodle_config:/app/config
      - caddy_data:/data
      - caddy_config:/config

volumes:
  db_data:
  moodle_data:
  moodle_config:
  caddy_data:
  caddy_config:
